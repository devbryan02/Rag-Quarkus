# ===========================================
# CHAT MODEL — Groq via OpenAI-compatible API
# ===========================================
quarkus.langchain4j.openai.base-url=https://api.groq.com/openai/v1
quarkus.langchain4j.openai.api-key=${GROQ_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=${GROQ_MODEL:openai/gpt-oss-120b}
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.timeout=30s

# ===========================================
# DEBUG — ver qué se envía/recibe del LLM
# ===========================================
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# ===========================================
# INGESTION y RETRIEVAL — parámetros custom
# ===========================================
rag.ingestion.documents-path=src/main/resources/documents
rag.ingestion.chunk-size=300
rag.ingestion.chunk-overlap=30
rag.retrieval.max-results=3
rag.retrieval.min-score=0.5

# ===========================================
# EMBEDDINGS — paraphrase-multilingual-MiniLM-L12-v2 (ONNX local, 384 dims)
# ===========================================
# Lo descarga la tarea Gradle downloadEmbeddingModel (corre sola antes de
# quarkusDev, test y build). En Docker se sobreescriben con RAG_EMBEDDING_*.
rag.embedding.model-path=models/paraphrase-multilingual-MiniLM-L12-v2/model.onnx
rag.embedding.tokenizer-path=models/paraphrase-multilingual-MiniLM-L12-v2/tokenizer.json

# ===========================================
# EMBEDDING STORE — PgVector (persistente)
# ===========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/pgvector/pgvector:pg16

# Tabla por modelo de embeddings: vectores de modelos distintos no son comparables,
# así que al cambiar de modelo se usa una tabla nueva y se re-indexa desde cero.
# (La tabla anterior "embeddings" era de AllMiniLmL6V2, solo inglés.)
quarkus.langchain4j.pgvector.table=embeddings_multilingual_minilm
quarkus.langchain4j.pgvector.dimension=384
quarkus.langchain4j.pgvector.create-table=true
quarkus.langchain4j.pgvector.register-vector-pg-extension=true

# En dev/test no se define jdbc.url a propósito: Quarkus Dev Services
# levanta un contenedor Postgres+pgvector efímero automáticamente
# (usando la imagen de arriba), igual que hoy no requiere nada externo.
%prod.quarkus.datasource.username=rag
%prod.quarkus.datasource.password=rag
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://pgvector:5432/rag

# ===========================================
# OPENAPI / SWAGGER UI
# ===========================================
quarkus.smallrye-openapi.info-title=RAG Quarkus API
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=API de preguntas y respuestas sobre documentos indexados (RAG) y carga de documentos.
quarkus.swagger-ui.always-include=true

# Esquema de seguridad X-API-Key (lo valida ApiKeyFilter). Se declara aquí porque
# @SecurityScheme en una clase que no extiende Application no es escaneado.
# Los endpoints lo referencian con @SecurityRequirement(name = "ApiKeyAuth").
quarkus.smallrye-openapi.security-scheme=api-key
quarkus.smallrye-openapi.security-scheme-name=ApiKeyAuth
quarkus.smallrye-openapi.security-scheme-description=API key requerida por /chat y /documents
quarkus.smallrye-openapi.api-key-parameter-name=X-API-Key
quarkus.smallrye-openapi.api-key-parameter-in=header
# Recuerda la key ingresada en Authorize al recargar la página
quarkus.swagger-ui.persist-authorization=true

# API KEY
app.api-key=${API_KEY}

